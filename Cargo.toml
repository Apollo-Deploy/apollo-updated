[package]
name = "apollo-updated"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Standalone local package updater with TUF trust and overlap handoff"

[[bin]]
name = "apollo-updated"
path = "src/main.rs"

[[bin]]
name = "apollo-updatectl"
path = "src/bin/updatectl.rs"

[[bin]]
name = "apollo-updated-fixture"
path = "src/bin/fixture.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["socket", "user", "process", "fs", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "fs", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3", features = ["parsing"] }
toml = "0.8.23"
tough = { version = "0.21.0", features = ["http"] }
url = { version = "2.5", features = ["serde"] }
walkdir = "2.5"
tar = "0.4"
zstd = "0.13"
fs2 = "0.4"
uuid = { version = "1.20", features = ["v4"] }

[dev-dependencies]
chrono = "0.4"
pem = "3"
tempfile = "3.24"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
